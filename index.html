<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prijava · Aeye</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="public/auth.css">
  <script defer src="js/auth.js"></script>
</head>
<body data-page="login">
  <main class="auth-shell">
    <a class="brand" href="index.html">Aeye<span>Prepoznavanje lica</span></a>
    <section class="auth-card" aria-labelledby="formTitle">
      <p class="eyebrow">Diplomski projekt</p>
      <h1 id="formTitle">Dobro došli.</h1>
      <p id="formDescription">Prijavite se za pristup aplikaciji.</p>
      <form id="authForm">
        <label for="password">Lozinka</label>
        <input id="password" name="password" type="password" inputmode="numeric" autocomplete="off" required pattern="[0-9]{4}" minlength="4" maxlength="4" autofocus>
        <button class="primary" id="submitButton" type="submit">Prijavi se</button>
      </form>
      <p id="authStatus" class="status" role="status" aria-live="polite"></p>
      <p class="approval-note">Za pristup unesite dnevnu lozinku.</p>
    </section>
    <footer>Aeye · Analiza lica u stvarnom vremenu</footer>
  </main>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));</script>
</body>
</html>
